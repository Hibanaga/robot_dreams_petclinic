- name: Install Docker
  become: true
  dnf:
    name: docker
    state: present
    update_cache: true

- name: Enable and start Docker
  become: true
  systemd:
    name: docker
    enabled: true
    state: started

- name: Add ec2-user to docker group
  become: true
  user:
    name: ec2-user
    groups: docker
    append: yes

- name: Ensure MySQL log directory exists
  file:
    path: /var/log/mysql
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Ensure MySQL log files exist
  file:
    path: "{{ item }}"
    state: touch
    owner: root
    group: root
    mode: '0644'
  loop:
    - /var/log/mysql/error.log
    - /var/log/mysql/slow.log

- name: Create Docker CLI plugins directory
  become: true
  file:
    path: /usr/libexec/docker/cli-plugins
    state: directory
    mode: '0755'

- name: Download docker-compose V2 binary
  become: true
  get_url:
    url: https://github.com/docker/compose/releases/download/v2.27.1/docker-compose-linux-x86_64
    dest: /usr/libexec/docker/cli-plugins/docker-compose
    mode: '0755'

- name: Enable and start Docker service
  become: true
  systemd:
    name: docker
    state: started
    enabled: true

- name: Add ec2-user to docker group
  become: true
  user:
    name: ec2-user
    groups: docker
    append: yes

- name: Ensure /opt/monitoring and subdirectories exist
  become: true
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /opt/monitoring
    - /opt/monitoring/configs

- name: Copy docker-compose.yml
  become: true
  copy:
    src: files/docker-compose.yml
    dest: /opt/monitoring/docker-compose.yml
    mode: '0644'

- name: Ensure promtail-config.yml is not a directory
  become: true
  file:
    path: /opt/monitoring/configs/promtail-config.yml
    state: absent

- name: Copy promtail config
  become: true
  copy:
    src: files/promtail-config.yml
    dest: /opt/monitoring/configs/promtail-config.yml
    mode: '0644'

- name: Remove existing promtail container if present
  become: true
  shell: |
    {% raw %}
    if docker ps -a --format '{{.Names}}' | grep -q '^promtail$'; then
      docker rm -f promtail
    fi
    {% endraw %}

- name: Start monitoring services via docker-compose
  become: true
  command: docker compose up -d --force-recreate
  args:
    chdir: /opt/monitoring