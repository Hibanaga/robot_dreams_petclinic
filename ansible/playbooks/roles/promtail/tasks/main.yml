- name: Install unzip
  yum:
    name: unzip
    state: present

- name: Download Promtail
  get_url:
    url: https://github.com/grafana/loki/releases/latest/download/promtail-linux-amd64.zip
    dest: /tmp/promtail.zip

- name: Extract Promtail
  unarchive:
    src: /tmp/promtail.zip
    dest: /usr/local/bin/
    remote_src: yes

- name: Rename binary
  command: mv /usr/local/bin/promtail-linux-amd64 /usr/local/bin/promtail
  args:
    creates: /usr/local/bin/promtail

- name: Make executable
  file:
    path: /usr/local/bin/promtail
    mode: '0755'

- name: Create systemd service
  copy:
    dest: /etc/systemd/system/promtail.service
    content: |
      [Unit]
      Description=Promtail
      After=network.target

      [Service]
      ExecStart=/usr/local/bin/promtail -config.file=/opt/monitoring/promtail/promtail-config.yml
      Restart=always

      [Install]
      WantedBy=multi-user.target

- name: Enable and start Promtail
  systemd:
    name: promtail
    enabled: yes
    state: started