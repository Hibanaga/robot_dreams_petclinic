- name: Install Docker on Amazon Linux 2023
  block:
    - name: Install Docker packages
      yum:
        name:
          - docker
          - containerd
        state: present

    - name: Ensure Docker CLI plugin directory exists
      file:
        path: /usr/local/lib/docker/cli-plugins
        state: directory
        mode: '0755'

    - name: Download Docker Compose v2 binary
      get_url:
        url: https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64
        dest: /usr/local/lib/docker/cli-plugins/docker-compose
        mode: '0755'

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Create monitoring directory
      file:
        path: /opt/monitoring
        state: directory
        mode: '0755'

    - name: Upload docker-compose.yml for monitoring stack
      copy:
        src: files/monitoring/docker-compose.yml
        dest: /opt/monitoring/docker-compose.yml
        mode: '0644'

    - name: Start monitoring stack with Docker Compose
      shell: docker compose -f /opt/monitoring/docker-compose.yml up -d
      args:
        chdir: /opt/monitoring
